hosts_static_entries:
  - { ip: 172.16.11.171, aliases: [ol9a.local, ol9a] }
  - { ip: 172.16.11.172, aliases: [ol9b.local, ol9b] }
  - { ip: 172.16.11.173, aliases: [ol9c.local, ol9c] }

iptables_enabled: true

