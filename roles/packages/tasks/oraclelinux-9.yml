- name: Install EPEL release package
  become: true
  ansible.builtin.package:
    name: oracle-epel-release-el9
    state: present

- name: Install packages from EPEL repository
  become: true
  ansible.builtin.package:
    name: "{{ packages_epel }}"
    state: present

- name: Enable Oracle Linux 9 addons repo
  become: true
  community.general.ini_file:
    path: /etc/yum.repos.d/oracle-linux-ol9.repo
    section: ol9_addons
    option: enabled
    value: "1"
    no_extra_spaces: true
    mode: "0644"
