- name: Gather minimal facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - 'hardware'
      - 'network'

- name: Install base packages
  become: true
  ansible.builtin.package:
    name: "{{ packages_standard }}"
    state: present

- name: Include OS-specific package installation tasks
  include_tasks: "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
