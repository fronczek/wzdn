- name: Ensure sshd_config.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: '0700'

- name: Ensure sshd_config includes sshd_config.d
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    state: present
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    validate: 'sshd -t -f %s'
    mode: '0600'
    regexp: '^Include /etc/ssh/sshd_config.d/\*\.conf'

- name: Customize sshd
  become: true
  ansible.builtin.template:
    src: "99-ansible.conf.j2"
    dest: "/etc/ssh/sshd_config.d/99-ansible.conf"
    mode: '0600'
    validate: 'sshd -t -f %s'
  notify:
    - Restart sshd
