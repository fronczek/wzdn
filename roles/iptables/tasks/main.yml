---

- name: Populate service facts
  service_facts:
  check_mode: false

- name: Gather some facts
  ansible.builtin.setup:
    gather_subset:
      - min
      - default_ipv4
  check_mode: false

- name: Install and configure iptables
  ansible.builtin.include_tasks:
    file: install.yml
  when:
    - iptables_enabled | bool
    - ansible_facts.services['puppet.service'] is not defined
